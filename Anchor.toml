[toolchain]
anchor_version = "0.29.0"

[features]
resolution = true
skip-lint = false

# One program: smart-wallet factory + fee enforcer + user-config tag.
# devnet/localnet id = the program that is ACTUALLY LIVE on devnet (322,896 B).
# mainnet id = not deployed yet; no keypair exists for it.
[programs.devnet]
skim_protocol = "2YHE64pk9NB5NZea7MUGKTdP6zKcjSg4dxdQUuxjdhqp"

[programs.localnet]
skim_protocol = "2YHE64pk9NB5NZea7MUGKTdP6zKcjSg4dxdQUuxjdhqp"

[programs.mainnet]
skim_protocol = "ECZ6ZsA79WqYEonfJcmSzp51SPg9nSDiTqu4bAxrfvc9"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
# Funded devnet key AND the on-chain upgrade authority for the live program.
# 95DmM5xt695F18s7ouhRHf9wETgyUKxWYWa9z5gma6YG. anchor expands the leading ~
# (shellexpand::tilde, anchor-cli 0.29 config.rs). Override with --provider.wallet.
wallet = "~/.config/solana/deployer.json"

[scripts]
test = "node tests/fee-math.test.js"
