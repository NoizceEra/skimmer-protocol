<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Skimmer Protocol — Pay Yourself First.">
  <defs>
    <linearGradient id="mint" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#12D18E"/>
      <stop offset="1" stop-color="#3DF5A5"/>
    </linearGradient>
    <linearGradient id="mintText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DF5A5"/>
      <stop offset="1" stop-color="#12D18E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121728" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#080C17" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="markbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <radialGradient id="auroraMint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3DF5A5" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3DF5A5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraIndigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5B8CFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 H0 V44" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#05070D"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="150" cy="30" rx="600" ry="430" fill="url(#auroraMint)"/>
  <ellipse cx="1130" cy="130" rx="560" ry="440" fill="url(#auroraIndigo)"/>
  <ellipse cx="880" cy="660" rx="580" ry="440" fill="url(#auroraViolet)"/>
  <ellipse cx="1180" cy="600" rx="380" ry="300" fill="url(#auroraMint)"/>
  <rect x="0" y="0" width="1200" height="2" fill="url(#mintText)" opacity="0.55"/>

  <!-- logo mark -->
  <g transform="translate(80,60) scale(0.8125)">
    <rect width="64" height="64" rx="15" fill="url(#markbg)"/>
    <rect x="0.5" y="0.5" width="63" height="63" rx="14.5" fill="none" stroke="#3DF5A5" stroke-opacity="0.28"/>
    <rect x="16" y="39" width="7" height="12" rx="3.5" fill="url(#mint)"/>
    <rect x="28.5" y="31" width="7" height="20" rx="3.5" fill="url(#mint)"/>
    <rect x="41" y="23" width="7" height="28" rx="3.5" fill="url(#mint)"/>
    <path d="M13 35 L51 8.6" fill="none" stroke="#3DF5A5" stroke-width="3.6" stroke-linecap="round"/>
  </g>
  <text x="150" y="104" font-family="'Space Grotesk','Inter','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif" font-size="30" font-weight="600" letter-spacing="0.2" fill="#EAF2FF">Skimmer Protocol</text>

  <!-- eyebrow chip -->
  <rect x="80" y="196" width="306" height="36" rx="18" fill="#3DF5A5" fill-opacity="0.10" stroke="#3DF5A5" stroke-opacity="0.30"/>
  <text x="104" y="220" font-family="'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace" font-size="14" letter-spacing="2.6" fill="#3DF5A5">NON-CUSTODIAL · ON SOLANA</text>

  <!-- headline -->
  <text x="80" y="344" font-family="'Space Grotesk','Inter','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif" font-size="92" font-weight="700" letter-spacing="-2" fill="#F4F8FF">Pay Yourself</text>
  <text x="80" y="452" font-family="'Space Grotesk','Inter','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif" font-size="92" font-weight="700" letter-spacing="-2" fill="url(#mintText)">First.</text>

  <!-- supporting line -->
  <text x="80" y="516" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif" font-size="25" fill="#9FB1CE">Set your savings rate once. Trade anywhere. Every trade pays you first.</text>

  <!-- right glass card -->
  <rect x="780" y="176" width="340" height="316" rx="24" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <text x="812" y="228" font-family="'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace" font-size="12.5" letter-spacing="3" fill="#7C93B8">SAVINGS RATE</text>
  <text x="812" y="306" font-family="'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace" font-size="66" font-weight="700" fill="url(#mintText)">10%</text>
  <text x="980" y="306" font-family="'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace" font-size="16" fill="#6F86B0">PER TRADE</text>
  <rect x="812" y="330" width="276" height="8" rx="4" fill="url(#mintText)"/>
  <line x1="812" y1="372" x2="1088" y2="372" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="812" y="428" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif" font-size="17" fill="#CDD9EE">Auto-save every trade</text>
  <rect x="1016" y="404" width="72" height="34" rx="17" fill="#3DF5A5" fill-opacity="0.14" stroke="#3DF5A5" stroke-opacity="0.40"/>
  <text x="1052" y="426" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace" font-size="13" fill="#3DF5A5">ON</text>
  <text x="812" y="464" font-family="'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace" font-size="12" fill="#7C93B8">you always get paid first</text>

  <!-- bottom lockup -->
  <line x1="80" y1="556" x2="1120" y2="556" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="80" y="592" font-family="'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace" font-size="18" fill="#93A9CB">skimmer-protocol.vercel.app</text>
  <text x="1120" y="592" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace" font-size="16" fill="#93A9CB">t.me/SkimmerProtocol_Bot</text>
</svg>
