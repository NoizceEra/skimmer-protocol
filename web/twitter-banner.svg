<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-label="Skimmer Protocol — Twitter Banner">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1A"/>
      <stop offset="50%" stop-color="#04070F"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Mint Gradients -->
    <linearGradient id="mint" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3DF5A5"/>
    </linearGradient>
    <linearGradient id="mintText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DF5A5"/>
      <stop offset="100%" stop-color="#12D18E"/>
    </linearGradient>
    <linearGradient id="glowBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DF5A5"/>
      <stop offset="50%" stop-color="#5B8CFF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Glass Fill -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1626" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#080C17" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glassPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DF5A5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#12D18E" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Auroras -->
    <radialGradient id="auroraTopMint" cx="62%" cy="12%" r="50%">
      <stop offset="0%" stop-color="#3DF5A5" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#3DF5A5" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#3DF5A5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraRightBlue" cx="92%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraLeftViolet" cx="12%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.028" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>

    <!-- Filter for soft glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1500" height="500" fill="url(#bgGrad)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>

  <!-- Ambient Light Fields -->
  <rect width="1500" height="500" fill="url(#auroraTopMint)"/>
  <rect width="1500" height="500" fill="url(#auroraRightBlue)"/>
  <rect width="1500" height="500" fill="url(#auroraLeftViolet)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1500" height="2" fill="url(#glowBar)" opacity="0.8"/>

  <!-- ================= LEFT / CENTER BRAND CONTENT (Safe from PFP overlap) ================= -->
  <g transform="translate(390, 0)">
    <!-- Brand Header & Category Chip -->
    <g transform="translate(0, 78)">
      <!-- Mini Brand Mark Icon -->
      <g transform="translate(0, -4) scale(0.52)">
        <rect width="64" height="64" rx="14" fill="#0C1322" stroke="#3DF5A5" stroke-opacity="0.30"/>
        <rect x="16" y="39" width="7" height="12" rx="3.5" fill="url(#mint)"/>
        <rect x="28.5" y="31" width="7" height="20" rx="3.5" fill="url(#mint)"/>
        <rect x="41" y="23" width="7" height="28" rx="3.5" fill="url(#mint)"/>
        <path d="M13 35 L51 8.6" fill="none" stroke="#3DF5A5" stroke-width="4.2" stroke-linecap="round"/>
      </g>
      
      <!-- Brand Name -->
      <text x="44" y="20" font-family="'Space Grotesk','Inter','Segoe UI',sans-serif" font-size="20" font-weight="700" letter-spacing="0.5" fill="#E2E8F0">Skimmer Protocol</text>
      
      <!-- Solana Chip -->
      <g transform="translate(240, 0)">
        <rect x="0" y="0" width="220" height="28" rx="14" fill="url(#glassPill)" stroke="#3DF5A5" stroke-opacity="0.30" stroke-width="1"/>
        <circle cx="14" cy="14" r="3.5" fill="#3DF5A5" filter="url(#softGlow)"/>
        <text x="26" y="19" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="11" font-weight="600" letter-spacing="1.8" fill="#3DF5A5">NON-CUSTODIAL · SOLANA</text>
      </g>
    </g>

    <!-- Main Typography Headline -->
    <g transform="translate(0, 184)">
      <text x="0" y="0" font-family="'Space Grotesk','Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5" fill="#F8FAFC">
        Pay Yourself <tspan fill="url(#mintText)">First.</tspan>
      </text>
    </g>

    <!-- Subtitle & Value Proposition -->
    <g transform="translate(0, 234)">
      <text x="0" y="0" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="400" fill="#94A3B8" letter-spacing="0.1">
        Set your savings rate once. Trade anywhere. Auto-save every cut.
      </text>
    </g>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 292)">
      <!-- Pill 1: Keep Your Keys -->
      <g transform="translate(0, 0)">
        <rect width="154" height="34" rx="10" fill="#0E1626" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
        <text x="14" y="22" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="12" fill="#CBD5E1">🔒 Keep Your Keys</text>
      </g>

      <!-- Pill 2: 0.4% Fee -->
      <g transform="translate(166, 0)">
        <rect width="138" height="34" rx="10" fill="#0E1626" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
        <text x="14" y="22" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="12" fill="#CBD5E1">⚡ 0.4% Flat Fee</text>
      </g>

      <!-- Pill 3: Telegram Bot -->
      <g transform="translate(316, 0)">
        <rect width="216" height="34" rx="10" fill="#0E1626" stroke="#3DF5A5" stroke-opacity="0.30" stroke-width="1"/>
        <text x="14" y="22" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="12" font-weight="600" fill="#3DF5A5">🤖 @SkimmerProtocol_Bot</text>
      </g>
    </g>

    <!-- Footer URL Links -->
    <g transform="translate(0, 396)">
      <text x="0" y="0" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="14" fill="#64748B">
        skimmer-protocol.vercel.app  <tspan fill="#334155">·</tspan>  <tspan fill="#64748B">SPL Token Standard</tspan>
      </text>
    </g>
  </g>

  <!-- ================= RIGHT SIDE INTERACTIVE TELEMETRY CARD ================= -->
  <g transform="translate(1030, 84)">
    <!-- Main Card Body -->
    <rect width="390" height="332" rx="22" fill="url(#glassCard)" stroke="#3DF5A5" stroke-opacity="0.18" stroke-width="1.5"/>
    <rect width="388" height="330" x="1" y="1" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>

    <!-- Card Header -->
    <g transform="translate(28, 38)">
      <text font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="11" letter-spacing="2" fill="#64748B">SAVINGS ENGINE</text>
      <rect x="256" y="-12" width="76" height="24" rx="12" fill="#3DF5A5" fill-opacity="0.12" stroke="#3DF5A5" stroke-opacity="0.30"/>
      <text x="294" y="4" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="10" font-weight="700" fill="#3DF5A5">● ACTIVE</text>
    </g>

    <!-- Rate Stat Display -->
    <g transform="translate(28, 112)">
      <text font-family="'Space Grotesk','JetBrains Mono',sans-serif" font-size="54" font-weight="800" fill="url(#mintText)">10%</text>
      <text x="140" y="-18" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="12" font-weight="600" fill="#94A3B8">SAVED PER TRADE</text>
      <text x="140" y="4" font-family="'Inter',sans-serif" font-size="12" fill="#64748B">Swept automatically</text>
      <!-- Progress Bar Track -->
      <rect x="0" y="24" width="334" height="6" rx="3" fill="#1E293B"/>
      <rect x="0" y="24" width="134" height="6" rx="3" fill="url(#mintText)"/>
    </g>

    <!-- Divider Line -->
    <line x1="28" y1="188" x2="362" y2="188" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>

    <!-- Simulated Transaction Row -->
    <g transform="translate(28, 226)">
      <rect width="334" height="42" rx="10" fill="#0A0F1D" stroke="#FFFFFF" stroke-opacity="0.05"/>
      <text x="14" y="26" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="12" fill="#94A3B8">Trade 10.0 SOL</text>
      <text x="320" y="26" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="12" font-weight="700" fill="#3DF5A5">+1.0 SOL Saved</text>
    </g>

    <!-- Micro Subline -->
    <g transform="translate(28, 296)">
      <text font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="10.5" fill="#475569">
        Bounded SPL Delegation · Revoke anytime
      </text>
    </g>
  </g>
</svg>
